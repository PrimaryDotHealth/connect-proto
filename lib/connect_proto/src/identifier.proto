syntax = "proto3";
package primary.connect;
option go_package = "primary.connect";

message Identifier {
  string id = 1;
  string id_type = 2;  // Identifier type, e.g. MRN, EPI, EHRI, NIST, NPI, Payor ID; from HL7 CX-5 (table 0203): MR, SR, PI
  // CX-4 assigning authority: the whole HL7 HD, with sub-components separated by `&`.
  // Either a bare namespace, e.g. CAA, NMSIIS, or namespace, universal ID and type,
  // e.g. CIIS&2.16.840.1.114222.4.1.144.2.4&ISO, Primary&2.16.840.1.113883.9.271&ISO
  string assigning_authority = 3;
}
